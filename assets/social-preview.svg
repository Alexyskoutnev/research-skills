<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="research-skills: nine Claude Code skills for writing an ML paper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="55%" stop-color="#152134"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E7DE8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#3E7DE8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E9E5B" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2E9E5B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="60" r="330" fill="url(#glow)"/>
  <circle cx="90" cy="600" r="280" fill="url(#glow2)"/>

  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="640" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" letter-spacing="7" fill="#6E8BB8">AGENT  SKILLS</text>

    <text x="640" y="300" font-size="104" font-weight="700" letter-spacing="-3" fill="#F2F6FC">research-skills</text>

    <text x="640" y="368" font-size="37" fill="#A8BCD8">Turn a working draft into a paper</text>
    <text x="640" y="418" font-size="37" fill="#A8BCD8">reviewers <tspan fill="#4ECA82" font-weight="600">accept</tspan>.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17"
     letter-spacing="1.6" text-anchor="middle">
    <g transform="translate(158,478)"><rect width="182" height="60" rx="10" fill="#131F33" stroke="#2C3E60" stroke-width="1.5"/><text x="91" y="38" fill="#93AACE">ABSTRACT</text></g>
    <g transform="translate(360,478)"><rect width="182" height="60" rx="10" fill="#131F33" stroke="#2C3E60" stroke-width="1.5"/><text x="91" y="38" fill="#93AACE">METHOD</text></g>
    <g transform="translate(562,478)"><rect width="182" height="60" rx="10" fill="#131F33" stroke="#2C3E60" stroke-width="1.5"/><text x="91" y="38" fill="#93AACE">RESULTS</text></g>
    <g transform="translate(764,478)"><rect width="182" height="60" rx="10" fill="#131F33" stroke="#2C3E60" stroke-width="1.5"/><text x="91" y="38" fill="#93AACE">CAPTIONS</text></g>
    <g transform="translate(966,478)"><rect width="182" height="60" rx="10" fill="#10301F" stroke="#2E9E5B" stroke-width="1.5"/><text x="91" y="38" fill="#5BC985">REBUTTAL</text></g>
  </g>

  <text x="640" y="586" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" letter-spacing="2.6" fill="#5F79A0">10 SKILLS  ·  PLAIN MARKDOWN  ·  MIT</text>
</svg>
