<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="research-skills lifecycle, eleven steps from abstract to rebuttal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D18"/><stop offset="60%" stop-color="#0C1727"/><stop offset="100%" stop-color="#080F1C"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="100" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="27" letter-spacing="6" fill="#7E97BE">ABSTRACT TO REBUTTAL</text>

    <!-- ROW 1 -->
    <g transform="translate(100,126)">
      <rect width="440" height="106" rx="14" fill="#1A2C4C" stroke="#5A8AD8" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#5A8AD8">1</text>
      <text x="76" y="66" font-size="44" fill="#EAF1FA">abstract</text>
    </g>
    <g transform="translate(580,126)">
      <rect width="440" height="106" rx="14" fill="#1A2C4C" stroke="#5A8AD8" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#5A8AD8">2</text>
      <text x="76" y="66" font-size="44" fill="#EAF1FA">intro + related</text>
    </g>
    <g transform="translate(1060,126)">
      <rect width="440" height="106" rx="14" fill="#1A2C4C" stroke="#5A8AD8" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#5A8AD8">3</text>
      <text x="76" y="66" font-size="44" fill="#EAF1FA">method</text>
    </g>

    <!-- ROW 2 -->
    <g transform="translate(100,266)">
      <rect width="440" height="106" rx="14" fill="#1A2C4C" stroke="#5A8AD8" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#5A8AD8">4</text>
      <text x="76" y="66" font-size="44" fill="#EAF1FA">results</text>
    </g>
    <g transform="translate(580,266)">
      <rect width="440" height="106" rx="14" fill="#1B2740" stroke="#7E97BE" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#7E97BE">5</text>
      <text x="76" y="66" font-size="44" fill="#D8E4F2">figures</text>
    </g>
    <g transform="translate(1060,266)">
      <rect width="440" height="106" rx="14" fill="#1B2740" stroke="#7E97BE" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#7E97BE">6</text>
      <text x="76" y="66" font-size="44" fill="#D8E4F2">captions</text>
    </g>

    <!-- ROW 3 -->
    <g transform="translate(100,406)">
      <rect width="440" height="106" rx="14" fill="#1A2C4C" stroke="#5A8AD8" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#5A8AD8">7</text>
      <text x="76" y="66" font-size="44" fill="#EAF1FA">conclusion</text>
    </g>
    <g transform="translate(580,406)">
      <rect width="440" height="106" rx="14" fill="#1B2740" stroke="#7E97BE" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#7E97BE">8</text>
      <text x="76" y="66" font-size="44" fill="#D8E4F2">appendix</text>
    </g>
    <g transform="translate(1060,406)">
      <rect width="440" height="106" rx="14" fill="#123A28" stroke="#46B575" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#46B575">9</text>
      <text x="76" y="66" font-size="44" fill="#B6EFCE">sentence audit</text>
    </g>

    <!-- ROW 4 -->
    <g transform="translate(100,546)">
      <rect width="440" height="106" rx="26" fill="#3A2A10" stroke="#E8B33E" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#E8B33E">10</text>
      <text x="90" y="66" font-size="44" font-weight="700" fill="#F5D68C">submit</text>
    </g>
    <g transform="translate(580,546)">
      <rect width="440" height="106" rx="14" fill="#123A28" stroke="#46B575" stroke-width="3"/>
      <text x="30" y="66" font-size="34" font-weight="700" fill="#46B575">11</text>
      <text x="90" y="66" font-size="44" fill="#B6EFCE">rebuttal</text>
    </g>

    <!-- resubmit loop -->
    <g stroke="#8A6A2A" stroke-width="3.5" fill="none" stroke-dasharray="11 9" stroke-linecap="round">
      <path d="M 1020 599 L 1120 599"/>
    </g>
    <text x="1140" y="588" font-size="31" fill="#C9A552">revise and</text>
    <text x="1140" y="626" font-size="31" fill="#C9A552">resubmit, back to 4</text>

    <!-- flow arrows -->
    <g stroke="#5E7DA8" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 548 179 L 574 179"/><path d="M 574 179 L 563 171"/><path d="M 574 179 L 563 187"/>
      <path d="M 1028 179 L 1054 179"/><path d="M 1054 179 L 1043 171"/><path d="M 1054 179 L 1043 187"/>
      <path d="M 548 319 L 574 319"/><path d="M 574 319 L 563 311"/><path d="M 574 319 L 563 327"/>
      <path d="M 1028 319 L 1054 319"/><path d="M 1054 319 L 1043 311"/><path d="M 1054 319 L 1043 327"/>
      <path d="M 548 459 L 574 459"/><path d="M 574 459 L 563 451"/><path d="M 574 459 L 563 467"/>
      <path d="M 1028 459 L 1054 459"/><path d="M 1054 459 L 1043 451"/><path d="M 1054 459 L 1043 467"/>
      <path d="M 548 599 L 574 599"/><path d="M 574 599 L 563 591"/><path d="M 574 599 L 563 607"/>
    </g>

    <text x="100" y="712" font-size="76" font-weight="800" letter-spacing="-2.4" fill="#FFFFFF">research-skills</text>
    <text x="100" y="770" font-size="40" fill="#8FA8C6">ten skills for writing an ML paper</text>
  </g>
</svg>
