<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="research-skills: turn a working draft into a paper reviewers accept">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="55%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E7DE8"/>
      <stop offset="50%" stop-color="#2E9E5B"/>
      <stop offset="100%" stop-color="#3E7DE8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E7DE8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3E7DE8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="260" fill="url(#glow)"/>
  <rect x="56" y="56" width="240" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- left: identity -->
  <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="56" y="100" font-size="13" letter-spacing="3.2" fill="#6E8BB8">CLAUDE  CODE  ·  AGENT  SKILLS</text>
  <text class="sans" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif' x="56" y="176" font-size="60" font-weight="700" fill="#F2F6FC" letter-spacing="-1.4">research-skills</text>
  <text class="sans" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif' x="56" y="222" font-size="24" fill="#9FB3D1">Turn a working draft into a paper</text>
  <text class="sans" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif' x="56" y="256" font-size="24" fill="#9FB3D1">reviewers <tspan fill="#2E9E5B" font-weight="600">accept</tspan>.</text>
  <text class="sans" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif' x="56" y="300" font-size="15" fill="#5F79A0">Ten skills. Plain Markdown. No framework.</text>

  <!-- right: the diff card -->
  <g transform="translate(672,74)">
    <rect x="0" y="0" width="472" height="196" rx="12" fill="#0A101C" stroke="#243350" stroke-width="1.2"/>
    <circle cx="22" cy="24" r="5" fill="#D9483B"/>
    <circle cx="40" cy="24" r="5" fill="#E8B33E"/>
    <circle cx="58" cy="24" r="5" fill="#2E9E5B"/>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="82" y="28" font-size="11.5" fill="#55708F">sentence-audit</text>

    <rect x="16" y="52" width="440" height="44" rx="7" fill="#D9483B" fill-opacity="0.10"/>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="30" y="70" font-size="12.5" fill="#D9483B">−</text>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="52" y="70" font-size="12.5" fill="#B9C6D8">This shows the model can generalize</text>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="52" y="88" font-size="12.5" fill="#B9C6D8">to unseen inputs.</text>

    <rect x="16" y="108" width="440" height="64" rx="7" fill="#2E9E5B" fill-opacity="0.10"/>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="30" y="126" font-size="12.5" fill="#2E9E5B">+</text>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="52" y="126" font-size="12.5" fill="#EAF1FA">This gap shows the router generalizes:</text>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="52" y="144" font-size="12.5" fill="#EAF1FA">40 ms on inputs it never saw, against</text>
    <text class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' x="52" y="162" font-size="12.5" fill="#EAF1FA">120 ms for the same model untuned.</text>
  </g>

  <!-- pipeline strip -->
  <g transform="translate(56,344)">
    <line x1="8" y1="26" x2="1080" y2="26" stroke="#22314C" stroke-width="1.4"/>
    <g class="mono" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="10.5" letter-spacing="1.1" text-anchor="middle">
      <g transform="translate(0,0)"><rect width="118" height="52" rx="8" fill="#111C2E" stroke="#2A3B5C"/><text x="59" y="31" fill="#8FA8CC">ABSTRACT</text></g>
      <g transform="translate(138,0)"><rect width="118" height="52" rx="8" fill="#111C2E" stroke="#2A3B5C"/><text x="59" y="31" fill="#8FA8CC">INTRO</text></g>
      <g transform="translate(276,0)"><rect width="118" height="52" rx="8" fill="#111C2E" stroke="#2A3B5C"/><text x="59" y="31" fill="#8FA8CC">METHOD</text></g>
      <g transform="translate(414,0)"><rect width="118" height="52" rx="8" fill="#111C2E" stroke="#2A3B5C"/><text x="59" y="31" fill="#8FA8CC">RESULTS</text></g>
      <g transform="translate(552,0)"><rect width="118" height="52" rx="8" fill="#111C2E" stroke="#2A3B5C"/><text x="59" y="31" fill="#8FA8CC">CAPTIONS</text></g>
      <g transform="translate(690,0)"><rect width="118" height="52" rx="8" fill="#111C2E" stroke="#2A3B5C"/><text x="59" y="31" fill="#8FA8CC">CONCLUSION</text></g>
      <g transform="translate(828,0)"><rect width="118" height="52" rx="8" fill="#111C2E" stroke="#2A3B5C"/><text x="59" y="31" fill="#8FA8CC">SUPPLEMENT</text></g>
      <g transform="translate(966,0)"><rect width="118" height="52" rx="8" fill="#0F2A1C" stroke="#2E9E5B"/><text x="59" y="31" fill="#5BC985">REBUTTAL</text></g>
    </g>
  </g>
</svg>
