<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="research-skills: a three phase pipeline for writing an ML paper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B16"/><stop offset="60%" stop-color="#0B1626"/><stop offset="100%" stop-color="#070D1A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">

    <text x="110" y="112" font-size="94" font-weight="800" letter-spacing="-3" fill="#FFFFFF">research-skills</text>
    <text x="110" y="176" font-size="44" fill="#9FB6D4">ten skills for writing an ML paper</text>

    <!-- WRITE -->
    <g transform="translate(110,250)">
      <rect width="440" height="466" rx="18" fill="#1D3053" stroke="#4E6E9E" stroke-width="3"/>
      <text x="40" y="82" font-size="58" font-weight="800" letter-spacing="2" fill="#7FB0FF">WRITE</text>
      <line x1="40" y1="116" x2="400" y2="116" stroke="#4E6E9E" stroke-width="3"/>
      <g font-size="44" fill="#E6EFFA">
        <text x="40" y="190">abstract</text>
        <text x="40" y="254">intro + related</text>
        <text x="40" y="318">method</text>
        <text x="40" y="382">results</text>
        <text x="40" y="446">conclusion</text>
      </g>
    </g>

    <!-- EVIDENCE -->
    <g transform="translate(610,250)">
      <rect width="440" height="466" rx="18" fill="#1D3053" stroke="#4E6E9E" stroke-width="3"/>
      <text x="40" y="82" font-size="58" font-weight="800" letter-spacing="2" fill="#A9C0DC">EVIDENCE</text>
      <line x1="40" y1="116" x2="400" y2="116" stroke="#4E6E9E" stroke-width="3"/>
      <g font-size="44" fill="#E6EFFA">
        <text x="40" y="190">figures</text>
        <text x="40" y="254">captions</text>
        <text x="40" y="318">supplement</text>
      </g>
    </g>

    <!-- SHIP -->
    <g transform="translate(1110,250)">
      <rect width="440" height="466" rx="18" fill="#123E2B" stroke="#4FBE7E" stroke-width="3"/>
      <text x="40" y="82" font-size="58" font-weight="800" letter-spacing="2" fill="#6FE5A2">SHIP</text>
      <line x1="40" y1="116" x2="400" y2="116" stroke="#4FBE7E" stroke-width="3"/>
      <g font-size="44" fill="#E6EFFA">
        <text x="40" y="190">sentence-audit</text>
        <text x="40" y="254">rebuttal</text>
      </g>
      <text x="40" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="34" fill="#7FE5A8">$ audit.py</text>
      <text x="40" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="34" fill="#A9C0DC">[bare-this]</text>
    </g>

    <!-- connectors -->
    <g stroke="#8FAAD2" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M 560 483 L 598 483"/><path d="M 598 483 L 582 471"/><path d="M 598 483 L 582 495"/>
      <path d="M 1060 483 L 1098 483"/><path d="M 1098 483 L 1082 471"/><path d="M 1098 483 L 1082 495"/>
    </g>

    <text x="110" y="820" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="40" fill="#8FA8C6">github.com/Alexyskoutnev/research-skills</text>
  </g>
</svg>
