<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="research-skills: a linter flags a bare This and the fix below it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="55%" stop-color="#152134"/>
      <stop offset="100%" stop-color="#0E1826"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E7DE8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3E7DE8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E9E5B" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2E9E5B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="70" r="400" fill="url(#glow)"/>
  <circle cx="110" cy="860" r="340" fill="url(#glow2)"/>

  <!-- top label -->
  <text x="140" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="25" letter-spacing="6" fill="#6E8BB8">ONE DEFECT A SCRIPT CAN CATCH</text>

  <!-- the flawed sentence -->
  <text x="140" y="360" font-family="Palatino, 'Palatino Linotype', Georgia, 'Times New Roman', serif"
        font-size="76" fill="#E9F0FA">This shows the model generalizes.</text>

  <!-- hand-drawn red circle around "This" -->
  <g stroke="#FF4A4A" fill="none" stroke-linecap="round" stroke-width="5" opacity="0.95">
    <path d="M 302 316 C 302 287, 258 271, 207 273 C 152 275, 116 295, 116 325 C 116 356, 158 376, 214 374 C 268 372, 305 352, 302 322 C 300 301, 274 287, 239 282"/>
  </g>

  <!-- linter output -->
  <text x="140" y="472" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#7E93B4">paper.tex:118  <tspan fill="#FF4A4A" font-weight="700">[bare-this]</tspan><tspan fill="#C2D2E6">  name the noun it points at</tspan></text>

  <!-- the fix -->
  <text x="140" y="650" font-family="Palatino, 'Palatino Linotype', Georgia, 'Times New Roman', serif"
        font-size="76" fill="#8FA8C6">This <tspan fill="#4ECA82" font-weight="700">gap</tspan> shows the model generalizes.</text>

  <!-- footer wordmark -->
  <text x="140" y="805" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="-1.5" fill="#F2F6FC">research-skills</text>
  <text x="140" y="852" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="30" fill="#8FA8C6">ten skills for writing an ML paper, abstract to rebuttal</text>
</svg>
